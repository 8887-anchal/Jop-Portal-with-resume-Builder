<div class="card auth-card">
  <div class="card-body">
    <h2 class="h4 mb-3">Welcome back</h2>
    <p class="text-muted mb-4">Login to manage your resume and job applications.</p>

    <div class="alert alert-danger" *ngIf="error">{{ error }}</div>

    <div class="mb-3">
      <label class="form-label">Email</label>
      <input
        type="email"
        class="form-control"
        [(ngModel)]="loginData.email"
        placeholder="you@email.com"
      />
    </div>

    <div class="mb-3">
      <label class="form-label">Password</label>
      <input
        type="password"
        class="form-control"
        [(ngModel)]="loginData.password"
        placeholder="Your password"
      />
    </div>

    <div class="mb-3">
      <label class="form-label">Login as</label>
     <select class="form-control" [(ngModel)]="loginData.role" title="Login as">
        <option value="USER">User</option>
        <option value="RECRUITER">Recruiter</option>
        <option value="ADMIN">Admin</option>
      </select>
    </div>

    <button class="btn btn-brand w-100" (click)="login()" [disabled]="loading">
      {{ loading ? 'Signing in...' : 'Login' }}
    </button>

    <p class="mt-3 text-center">
      No account yet? <a routerLink="/register">Register</a>
    </p>
  </div>
</div>
