<div class="container-fluid">
  <div class="card p-4">
    <h2 class="mb-2">My Applications</h2>
    <p class="text-muted">Track the jobs you have applied for.</p>

    <div class="alert alert-info" *ngIf="loading">Loading applications...</div>
    <div class="alert alert-warning" *ngIf="error">{{ error }}</div>

    <ul class="list-group list-group-flush" *ngIf="!loading && !error">
      <li class="list-group-item" *ngFor="let app of applications">
        <div><strong>Job ID:</strong> {{ app.jobId }}</div>
        <div><strong>Status:</strong> {{ app.status }}</div>
      </li>
    </ul>

    <div class="alert alert-info" *ngIf="!loading && !error && applications.length === 0">
      No applications yet.
    </div>
  </div>
</div>
