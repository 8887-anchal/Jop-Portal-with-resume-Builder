<div class="container-fluid">
  <div class="alert alert-info" *ngIf="loading">Loading job...</div>
  <div class="alert alert-warning" *ngIf="error">{{ error }}</div>

  <div class="card p-4" *ngIf="!loading && job">
    <div class="d-flex align-items-center justify-content-between">
      <div>
        <h2 class="mb-1">{{ job.title }}</h2>
        <p class="text-muted">{{ job.location }}</p>
      </div>
      <span class="badge badge-sheen" *ngIf="job.salary">₹ {{ job.salary }}</span>
    </div>

    <hr />

    <p>{{ job.description || 'No description available.' }}</p>

    <div class="mt-3 d-flex gap-2 align-items-center">
      <button class="btn btn-brand" (click)="apply()">Apply Job</button>
      <button class="btn btn-outline-secondary" (click)="saveJob()">Save</button>
      <span class="text-muted" *ngIf="actionMessage">{{ actionMessage }}</span>
    </div>
  </div>
</div>
